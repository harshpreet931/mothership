name: Feature request
description: An idea that would make Mothership better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: The idea
      description: How you imagine it working. Sketches welcome.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
